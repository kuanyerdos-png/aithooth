<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live demo — Qerivo</title>
<meta name="description" content="Reply as a patient and see how Qerivo answers questions and moves toward a booking." />
<link rel="icon" href="assets/qerivo-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="demo" data-title="demo.title">
<div id="site-header"></div>
<main>
<section class="container hero">
<div>
<div class="eyebrow" data-i18n="demo.eyebrow"></div>
<h1 data-i18n="demo.h1" style="font-size:clamp(30px,3.8vw,46px)"></h1>
<p class="sub" data-i18n="demo.p"></p>
<ul class="checks" style="margin-top:28px"><li data-i18n="demo.p1"></li><li data-i18n="demo.p2"></li><li data-i18n="demo.p3"></li></ul>
</div>
<div class="chat">
<div class="chat-head"><img src="assets/qerivo-logo.png" alt="" /><div><strong data-i18n="demo.name"></strong><small><span class="dot"></span><span data-i18n="demo.status"></span></small></div></div>
<div class="chat-body" id="chat-body" aria-live="polite"></div>
<div class="chips" id="chips"><button type="button" data-i18n="demo.c1"></button><button type="button" data-i18n="demo.c2"></button><button type="button" data-i18n="demo.c3"></button></div>
<form class="chat-form" id="chat-form"><input id="chat-input" type="text" maxlength="500" autocomplete="off" data-i18n-ph="demo.ph" data-i18n-label="demo.ph" /><button type="submit" data-i18n-label="demo.send">↑</button></form>
<div class="chat-note" data-i18n="demo.note"></div>
</div>
</section>
<section class="section" style="padding-top:0"><div data-cta></div></section>
</main>
<div id="site-footer"></div>
<script src="js/i18n.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
